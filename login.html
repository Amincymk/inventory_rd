<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">

    <title>Login</title>
</head>

<body class="min-h-screen flex items-center justify-center
             bg-[#020f29]
             px-4">

    <!-- Login Container -->
    <div class="w-full max-w-md">

        <!-- Logo / Brand -->
        <div class="mb-6 text-center">
            <div class="flex items-center justify-center w-12 h-12 mx-auto mb-3 text-xl font-bold text-white bg-red-600 rounded-xl">
                A
            </div>

            <h1 class="text-2xl font-bold text-white">
                Welcome back
            </h1>

            <p class="mt-2 text-sm text-gray-400">
                Sign in to your account to continue
            </p>
        </div>


        <!-- Login Card -->
        <div class="p-6 border shadow-2xl rounded-2xl border-white/20 bg-white/5 backdrop-blur-xl sm:p-8">

            <form>

                <!-- Email -->
                <div class="mb-5">
                    <label
                        for="email"
                        class="block mb-2 text-sm font-medium text-gray-300">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                        class="w-full px-4 py-3 text-white placeholder-gray-500 transition border rounded-lg outline-none border-white/10 bg-white/10 focus:border-red-500 focus:ring-2 focus:ring-red-500/20">
                </div>


                <!-- Password -->
                <div class="mb-4">
                    <label
                        for="password"
                        class="block mb-2 text-sm font-medium text-gray-300">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                        class="w-full px-4 py-3 text-white placeholder-gray-500 transition border rounded-lg outline-none border-white/10 bg-white/10 focus:border-red-500 focus:ring-2 focus:ring-red-500/20">
                </div>


                <!-- Remember + Forgot -->
                <div class="flex items-center justify-between mb-6">

                    <label class="flex items-center gap-2 text-sm text-gray-400">
                        <input
                            type="checkbox"
                            class="w-4 h-4 bg-transparent border-gray-600 rounded accent-red-600">

                        Remember me
                    </label>

                    <a
                        href="#"
                        class="text-sm text-red-500 hover:text-red-400">
                        Forgot password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full rounded-lg
                           bg-red-600
                           py-3
                           text-sm font-semibold
                           text-white
                           transition
                           hover:bg-red-700
                           focus:outline-none
                           focus:ring-2
                           focus:ring-red-500
                           active:scale-[0.98]">

                    Sign in
                </button>

            </form>


            <!-- Divider -->
            <div class="flex items-center gap-4 my-6">

                <div class="flex-1 h-px bg-white/10"></div>

                <span class="text-xs text-gray-500">
                    OR
                </span>

                <div class="flex-1 h-px bg-white/10"></div>

            </div>


            <!-- Google Button -->
            <button
                type="button"
                class="w-full py-3 text-sm font-medium text-gray-300 transition border rounded-lg border-white/10 bg-white/5 hover:bg-white/10">

                Continue with Google

            </button>


            <!-- Sign Up -->
            <p class="mt-6 text-sm text-center text-gray-400">

                Don't have an account?

                <a
                    href="#"
                    class="font-medium text-red-500 hover:text-red-400">

                    Create account

                </a>

            </p>

        </div>


        <!-- Footer -->
        <p class="mt-6 text-xs text-center text-gray-500">
            © 2026 stockflow. All rights reserved.
        </p>

    </div>

</body>
</html>
